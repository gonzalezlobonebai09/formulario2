<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Taylor Swift</title>
    <link rel="stylesheet" href="styles5.css">
</head>
<body>
    <div>
        <h1>Registro The Eras Tour</h1>
        <p>Completa todos los campos para asegurar tu lugar</p>

        <form action="#" method="POST" id="registroForm">
        
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Olivia Rodriguez" required>
                </div>

                <div>
                    <label for="dirección">Dirección</label>
                    <input type="text" id="dirección" name="dirección" placeholder="Ej: Acoyte 18" required>
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: olivia26@correo.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 2460-1056">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>
            </fieldset>

            <fieldset>
                <legend>Información Adicional</legend>

                <div>
                    <label for="pais">País</label>
                    <select id="pais" name="pais" required>
                        <option value="">Selecciona un país</option>
                        <option value="AR">Argentina</option>
                        <option value="BO">Bolivia</option>
                        <option value="BR">Brasil</option>
                        <option value="CL">Chile</option>
                        <option value="CO">Colombia</option>
                        <option value="EC">Ecuador</option>
                        <option value="ES">España</option>
                        <option value="MX">México</option>
                        <option value="PE">Perú</option>
                        <option value="UY">Uruguay</option>
                        <option value="VE">Venezuela</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <div>
                    <label>Intereses / Eras Favoritas</label>
                    <div>
                        <label><input type="checkbox" name="intereses" value="Ropa"> Ropa</label>
                        <label><input type="checkbox" name="intereses" value="Joyeria"> Joyería</label>
                        <label><input type="checkbox" name="intereses" value="Bolsos"> Bolsos</label>
                        <label><input type="checkbox" name="intereses" value="Música"> Música</label>
                        <label><input type="checkbox" name="intereses" value="Hogar"> Hogar</label>
                    </div>
                </div>

                <div>
                    <label for="comentarios">Opinión</label>
                    <textarea id="comentarios" name="Opinión" rows="4" placeholder="Escribe tu opinión aquí..."></textarea>
                </div>
            </fieldset>
            
            <fieldset>
                <legend>Password</legend>

                <div>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
            </fieldset>

            <div>
                <label class="terminos-label">
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>

            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>
</body>
</html>
